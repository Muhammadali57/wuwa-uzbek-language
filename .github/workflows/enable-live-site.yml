name: Enable live site features

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-live-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load live frontend modules
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '  <script src="js/app.js"></script>'
          tags = '\n'.join(['  <script src="js/live.js"></script>', '  <script src="js/community.js"></script>'])
          if 'js/live.js' not in s:
              s = s.replace(marker, marker + '\n' + tags)
          elif 'js/community.js' not in s:
              s = s.replace('  <script src="js/live.js"></script>', '  <script src="js/live.js"></script>\n  <script src="js/community.js"></script>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable community voice module"
          git push
