name: Enable live site features

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-live-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load live frontend module
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '  <script src="js/live.js"></script>\n'
          if 'js/live.js' not in s:
              s = s.replace('  <script src="js/app.js"></script>', '  <script src="js/app.js"></script>\n' + tag)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable live voting and global chat"
          git push
